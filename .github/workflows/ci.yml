name: Source mechanics

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mechanics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdlib-tests:
    # GitHub's standard public-repo runners are free; private runners can bill.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify toy mechanics with system Python only
        run: python3 -m unittest discover -s experiments/toy-transfer -p 'test_*.py' -v

      - name: Verify strict Trek SGD fixture
        run: python3 -m unittest discover -s experiments/trek-transfer-v0 -p 'test_*.py' -v

      - name: Verify exact-base core contract
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_core_*.py' -v

