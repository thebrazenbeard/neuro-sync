name: Source mechanics

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mechanics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdlib-tests:
    # GitHub's standard public-repo runners are free; private runners can bill.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify toy mechanics with system Python only
        run: python3 -m unittest discover -s experiments/toy-transfer -p 'test_*.py' -v

      - name: Verify strict Trek SGD fixture
        run: python3 -m unittest discover -s experiments/trek-transfer-v0 -p 'test_*.py' -v

      - name: Verify exact-base core contract
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_core_*.py' -v

      - name: Verify StateBus core local-ledger mechanics
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_bus_core.py' -v

      - name: Verify client-mediated StateBus bridge
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_bus_bridge.py' -v

      - name: Verify Node.js for cross-runtime restricted-wire vectors
        run: node --version

      - name: Verify restricted cross-runtime wire profile
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_bus_wire.py' -v

      - name: Verify host-bound read and use gate mechanics
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_bus_read_gate.py' -v

      - name: Verify durable use-time authority and replay protection
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_bus_effect_gate.py' -v

      - name: Verify exact-plan effect authorization, rollback and single-use controls
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_bus_plan_gate.py' -v

      - name: Verify durable clock authority rollback and fail-closed controls
        run: test -f tests/test_bus_clock_floor.py && PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_bus_clock_floor.py' -v

      - name: Verify read-only recovery diagnostics and historical-restore falsifiers
        run: |
          test -f tests/test_bus_recovery_preflight.py
          test -f tests/test_bus_recovery_falsifiers.py
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_bus_recovery_preflight.py' -v
          PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_bus_recovery_falsifiers.py' -v

      - name: Verify both zero-weight scripted and randomized causal pilots
        run: python3 -m unittest discover -s experiments/zero-weight-sync -p 'test_*.py' -v

      - name: Verify bounded real-receiver pilot fixtures (no model call)
        run: python3 -m unittest discover -s experiments/real-model-sync -p 'test_*.py' -v

      - name: Verify reversible compact receiver catalog (offline, no model call)
        run: PYTHONPATH=src python3 -m unittest discover -s experiments/real-model-sync/compact_catalog -p 'test_*.py' -v

      - name: Verify three-arm governance differential (no model call)
        run: python3 -m unittest discover -s experiments/governance-differential -p 'test_*.py' -v

      - name: Verify tiny recipient-retention transfer falsifiers (no model call)
        run: python3 -m unittest discover -s experiments/transfer-falsifiers -p 'test_*.py' -v

      - name: Verify scenario-unit statistics and malformed receipt controls
        run: python3 -m unittest discover -s experiments/real-model-sync/statistics -p 'test_*.py' -v
